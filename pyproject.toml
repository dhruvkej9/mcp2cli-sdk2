[project]
name = "mcp2cli-sdk2"
version = "3.6.0"
description = "Turn any MCP server or OpenAPI spec into a CLI"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Stephan Fitzpatrick", email = "stephan@knowsuchagency.com" }
]
requires-python = ">=3.10"
dependencies = [
    # httpx2 (not httpx 0.x): the MCP SDK 2.0 OAuth providers are httpx2.Auth
    # subclasses and its transports raise httpx2 exceptions, so mcp2cli's own
    # HTTP layer has to be the same library to interoperate.
    "httpx2>=2.0",
    "mcp>=2.0.0",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "real: hits real third-party MCP servers over the network (opt-in via MCP2CLI_TEST_REAL=1)",
    "slow: takes more than a few seconds",
]

[project.urls]
Homepage = "https://github.com/knowsuchagency/mcp2cli"
Repository = "https://github.com/knowsuchagency/mcp2cli"

[project.scripts]
mcp2cli = "mcp2cli:main"

[tool.uv.build-backend]
# Keep the importable module name as `mcp2cli` even though the PyPI
# distribution is published as `mcp2cli-sdk2`.
module-name = "mcp2cli"
module-root = "src"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
